worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;   # SSE streams hold 2 connections each (PLAN §15)
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  client_max_body_size 16k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Camera-effect files are large: cap parallel downloads per client
  # (a background and a mask together fetch six files).
  limit_conn_zone $binary_remote_addr zone=vision_conn:10m;

  # Meeting codes are capabilities: never write them to access logs.
  map $uri $log_uri {
    ~^(?<p>/api/v1/meetings/|/m/)[^/]+(?<rest>.*)$ $p:code$rest;
    default $uri;
  }
  log_format json escape=json '{"time":"$time_iso8601","method":"$request_method",'
    '"uri":"$log_uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"request_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  include /tmp/nginx/*.conf;
}
