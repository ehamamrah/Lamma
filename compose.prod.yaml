# Production overlay:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Every secret is required here (no dev fallbacks), and the API's production
# guards reject weak or dev values at startup.
x-required: &prod-env
  APP_ENV: production
  LOG_LEVEL: info
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  DATABASE_URL: postgres://lamma_app:${POSTGRES_APP_PASSWORD:?}@postgres:5432/lamma?sslmode=disable
  DATABASE_MIGRATE_URL: postgres://lamma:${POSTGRES_PASSWORD:?}@postgres:5432/lamma?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?e.g. wss://rtc.example.com}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
  ORIGIN_HASH_KEY: ${ORIGIN_HASH_KEY:?}
  COOKIE_SECURE: "true"
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?nginx address}

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  migrate:
    environment: *prod-env
  api:
    environment: *prod-env
  livekit:
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
      NODE_IP: ${LIVEKIT_NODE_IP:-}
      LIVEKIT_TURN_CERT: /etc/lamma/tls/turn.crt
      LIVEKIT_TURN_KEY: /etc/lamma/tls/turn.key
      # LIVEKIT_CONFIG is interpolated from .env: set LIVEKIT_USE_EXTERNAL_IP=true,
      # LIVEKIT_TURN_DOMAIN=turn.example.com and LIVEKIT_TURN_TLS_PORT=5349 there.
    # Signaling (7880) is reached only through Nginx TLS in prod.
    ports: !override
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
    volumes:
      - ${TLS_CERT_DIR:?}:/etc/lamma/tls:ro
  web:
    environment:
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:?e.g. wss://rtc.example.com https://rtc.example.com}
      APP_DOMAIN: ${APP_DOMAIN:?}
      RTC_DOMAIN: ${RTC_DOMAIN:?}
      LB_CIDR: ${LB_CIDR:-127.0.0.1/32}
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes:
      - ./deploy/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?}:/etc/lamma/tls:ro
